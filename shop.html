function getStatusClass(status) {
  if (status === "Verfügbar") return "status-verfuegbar";
  if (status === "Reserviert") return "status-reserviert";
  if (status === "Verkauft") return "status-verkauft";
  return "";
}

function renderCards(filter = "Alle", searchTerm = "") {
  if (!cardGrid) return;

  cardGrid.innerHTML = "";

  const cleanSearch = searchTerm.trim().toLowerCase();

  const filteredCards = cards.filter(card => {
    const matchesFilter =
      filter === "Alle" ||
      card.type.includes(filter) ||
      card.status === filter;

    const searchableText = `
      ${card.name}
      ${card.details}
      ${card.price}
      ${card.type}
      ${card.status}
    `.toLowerCase();

    const matchesSearch =
      cleanSearch === "" ||
      searchableText.includes(cleanSearch);

    return matchesFilter && matchesSearch;
  });

  filteredCards.forEach(card => {
    const isSold = card.status === "Verkauft";
    const statusClass = getStatusClass(card.status);

    cardGrid.innerHTML += `
      <div class="card ${isSold ? "sold-card" : ""}">
        <div class="status-badge ${statusClass}">
          ${card.status}
        </div>

        <div class="card-inner">
          <div class="card-front">
            <img src="${card.image}" alt="${card.name}">
            <h3>${card.name}</h3>
          </div>

          <div class="card-back">
            <h3>${card.name}</h3>
            <p>${card.details}</p>
            <p>${card.price}</p>

            ${
              isSold
              ? `<button class="sold-button" disabled>Verkauft</button>`
              : `<a href="${card.ebay}" target="_blank">
                   <button>Auf eBay ansehen</button>
                 </a>`
            }
          </div>
        </div>
      </div>
    `;
  });

  if (filteredCards.length === 0) {
    cardGrid.innerHTML = `
      <p class="no-cards-message">
        Keine Karten gefunden. Versuch einen anderen Suchbegriff oder eine andere Kategorie.
      </p>
    `;
  }
}

  const currentFilter = shopFilter ? shopFilter.value : "Alle";
  const currentSearch = shopSearch ? shopSearch.value : "";

  renderCards(currentFilter, currentSearch);
}

function openLegalModal(type) {
  if (!legalModal || !legalModalTitle || !legalModalBody) return;

  const content = legalContent[type];

  if (!content) return;

  legalModalTitle.textContent = content.title;
  legalModalBody.innerHTML = content.body;
  legalModal.classList.add("active");
  legalModal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeLegalModal() {
  if (!legalModal) return;

  legalModal.classList.remove("active");
  legalModal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

document.querySelectorAll("[data-modal]").forEach(button => {
  button.addEventListener("click", () => {
    openLegalModal(button.dataset.modal);
  });
});

/* PARALLAX BACKGROUND */
(() => {
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const floatingCards = Array.from(document.querySelectorAll(".floating-card"));

  if (!floatingCards.length || prefersReducedMotion) return;

  function updateParallax() {
    const scrollY = window.scrollY || window.pageYOffset;
    const viewportH = window.innerHeight;

    floatingCards.forEach((card) => {
      const speed = Number(card.dataset.speed || 0.25);
      const start = Number(card.dataset.start || 0);

      const y = viewportH + start - scrollY * (speed * 3.2);
      const drift = Math.sin((scrollY + start) * 0.003) * 28;
      const tilt = Math.sin((scrollY + start) * 0.002) * 7;

      const styles = getComputedStyle(card);
      const rotate = styles.getPropertyValue("--r").trim();
      const rotateY = styles.getPropertyValue("--ry").trim();
      const rotateX = styles.getPropertyValue("--rx").trim();
      const z = styles.getPropertyValue("--z").trim();

      card.style.transform =
        `translate3d(${drift}px, ${y}px, ${z}) rotate(calc(${rotate} + ${tilt}deg)) rotateY(${rotateY}) rotateX(${rotateX})`;
    });
  }

  let ticking = false;

  function requestParallaxUpdate() {
    if (ticking) return;

    ticking = true;

    requestAnimationFrame(() => {
      updateParallax();
      ticking = false;
    });
  }

  window.addEventListener("scroll", requestParallaxUpdate, { passive: true });
  window.addEventListener("resize", requestParallaxUpdate);

  updateParallax();
})();
